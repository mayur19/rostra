name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://rostra:rostra@localhost:5432/rostra_dev
      TEST_DATABASE_URL: postgresql://rostra:rostra@localhost:5432/rostra_test
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Start the runner's PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost -p 5432; do sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE rostra LOGIN PASSWORD 'rostra' CREATEDB;"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE rostra_dev OWNER rostra;"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE rostra_test OWNER rostra;"

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Migrate and seed the development database
        run: |
          npm run db:migrate
          npm run db:seed
