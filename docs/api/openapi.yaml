# Rostra API: full target surface. x-status marks implemented vs pending operations.
openapi: '3.1.0'
info:
  title: 'Rostra API'
  version: '0.1.0'
  description: 'Workforce scheduling with an in-house constraint solver. Every operation carries x-status (implemented | pending); pending operations answer 501 NOT_IMPLEMENTED with the backlog ticket in error.details.ticket.'
  license:
    name: 'MIT'
servers:
  - url: 'http://127.0.0.1:4108'
    description: 'Local development'
security:
  - sessionCookie: []
    csrfHeader: []
tags:
  - name: 'Platform'
  - name: 'Auth'
  - name: 'Audit'
  - name: 'Organization'
  - name: 'Workforce'
  - name: 'Rosters'
  - name: 'Rules'
  - name: 'Demand'
  - name: 'Time off'
  - name: 'Notifications'
  - name: 'Marketplace'
  - name: 'Time and attendance'
  - name: 'Payroll and reports'
  - name: 'Self-service'
paths:
  '/api/v1/audit-logs':
    get:
      operationId: 'listAuditLogs'
      summary: 'Audit trail for the organization'
      tags:
        - 'Audit'
      x-status: 'implemented'
      parameters:
        - '$ref': '#/components/parameters/Limit'
        - '$ref': '#/components/parameters/Offset'
      responses:
        200:
          description: 'OK'
          content:
            application/json:
              schema:
                allOf:
                  - '$ref': '#/components/schemas/Envelope'
                  - type: 'object'
                    properties:
                      data:
                        type: 'array'
                        items:
                          '$ref': '#/components/schemas/AuditEntry'
        400:
          '$ref': '#/components/responses/Error'
        401:
          '$ref': '#/components/responses/Error'
        403:
          '$ref': '#/components/responses/Error'
        404:
          '$ref': '#/components/responses/Error'
        422:
          '$ref': '#/components/responses/Error'
  '/api/v1/auth/csrf':
    get:
      operationId: 'getCsrf'
      summary: 'Issue or return the CSRF token (sets rostra_csrf cookie)'
      tags:
        - 'Auth'
      x-status: 'implemented'
      security: []
      responses:
        200:
          description: 'OK'
          content:
            application/json:
              schema:
                allOf:
                  - '$ref': '#/components/schemas/Envelope'
                  - type: 'object'
