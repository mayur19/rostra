components:
  securitySchemes:
    sessionCookie:
      type: 'apiKey'
      in: 'cookie'
      name: 'rostra_session'
      description: 'Opaque HttpOnly SameSite=Lax session token; stored server-side as an HMAC.'
    csrfHeader:
      type: 'apiKey'
      in: 'header'
      name: 'x-csrf-token'
      description: 'Required on POST/PUT/PATCH/DELETE; must equal the rostra_csrf cookie and the session token.'
  parameters:
    Id:
      name: 'id'
      in: 'path'
      required: true
      schema:
        type: 'string'
        format: 'uuid'
    ShiftId:
      name: 'shiftId'
      in: 'path'
      required: true
      schema:
        type: 'string'
        format: 'uuid'
    Limit:
      name: 'limit'
      in: 'query'
      schema:
        type: 'integer'
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: 'offset'
      in: 'query'
      schema:
        type: 'integer'
        minimum: 0
        default: 0
  responses:
    Error:
      description: 'Error envelope'
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/Envelope'
    NotImplemented:
      description: 'Planned endpoint'
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/Envelope'
          example:
            data: null
            error:
              code: 'NOT_IMPLEMENTED'
              message: 'Roster publishing is not implemented yet'
              details:
                ticket: 'RO-170'
  schemas:
    Envelope:
      type: 'object'
      required:
        - 'data'
        - 'error'
      properties:
        data: {}
        error:
          oneOf:
            - type: 'null'
            - '$ref': '#/components/schemas/Error'
        meta:
          '$ref': '#/components/schemas/PageMeta'
    Error:
      type: 'object'
      required:
        - 'code'
        - 'message'
      properties:
        code:
          type: 'string'
          examples:
            - 'VALIDATION_FAILED'
            - 'UNAUTHORIZED'
            - 'FORBIDDEN'
            - 'NOT_FOUND'
            - 'CONFLICT'
            - 'RATE_LIMITED'
            - 'CSRF_FAILED'
            - 'INVALID_CREDENTIALS'
            - 'INVALID_PROBLEM'
            - 'REGISTRATION_FAILED'
            - 'NOT_IMPLEMENTED'
            - 'INTERNAL'
        message:
          type: 'string'
        details: {}
    PageMeta:
      type: 'object'
      properties:
        total:
          type: 'integer'
        limit:
          type: 'integer'
        offset:
          type: 'integer'
    CsrfToken:
      type: 'object'
      properties:
        csrfToken:
          type: 'string'
    RegisterRequest:
      type: 'object'
      required:
        - 'organizationName'
        - 'name'
        - 'email'
        - 'password'
      properties:
        organizationName:
          type: 'string'
          minLength: 2
          maxLength: 120
        name:
          type: 'string'
        email:
          type: 'string'
          format: 'email'
        password:
          type: 'string'
          minLength: 12
          maxLength: 200
        timezone:
          type: 'string'
          description: 'IANA zone, any spelling; stored canonical'
          default: 'UTC'
    LoginRequest:
      type: 'object'
      required:
        - 'email'
        - 'password'
      properties:
        email:
          type: 'string'
          format: 'email'
        password:
          type: 'string'
    Me:
      type: 'object'
      properties:
        user:
          type: 'object'
          properties:
            id:
              type: 'string'
              format: 'uuid'
            email:
              type: 'string'
            name:
              type: 'string'
            role:
              '$ref': '#/components/schemas/Role'
        organization:
          type: 'object'
          properties:
            id:
              type: 'string'
              format: 'uuid'
            name:
              type: 'string'
            timezone:
              type: 'string'
        permissions:
          type: 'array'
          items:
            type: 'string'
        csrfToken:
          type: 'string'
    Role:
      type: 'string'
      enum:
        - 'owner'
        - 'admin'
        - 'scheduler'
        - 'manager'
        - 'employee'
    AuditEntry:
      type: 'object'
      properties:
        id:
          type: 'integer'
        actorUserId:
          type:
            - 'string'
            - 'null'
        action:
          type: 'string'
        entityType:
          type: 'string'
        entityId:
          type:
            - 'string'
            - 'null'
        requestId:
          type:
            - 'string'
            - 'null'
        details:
          type: 'object'
        createdAt:
          type: 'string'
          format: 'date-time'
    Skill:
      type: 'object'
      properties:
        id:
          type: 'string'
          format: 'uuid'
        code:
          type: 'string'
        name:
          type: 'string'
    SkillCreate:
      type: 'object'
      required:
        - 'code'
        - 'name'
      properties:
        code:
          type: 'string'
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        name:
          type: 'string'
    Contract:
      type: 'object'
      required:
        - 'minHoursPerWeek'
        - 'maxHoursPerWeek'
        - 'maxConsecutiveDays'
        - 'minRestHours'
      properties:
        minHoursPerWeek:
          type: 'number'
          minimum: 0
        maxHoursPerWeek:
          type: 'number'
        overtimeAfterHours:
          type: 'number'
          default: 40
        maxConsecutiveDays:
          type: 'integer'
          minimum: 1
          maximum: 7
        minRestHours:
          type: 'number'
          minimum: 0
          maximum: 24
        maxShiftsPerDay:
          type: 'integer'
          minimum: 1
          maximum: 3
          default: 1
    SkillGrant:
      type: 'object'
      required:
        - 'skill'
      properties:
        skill:
          type: 'string'
        expiresOn:
          type:
            - 'string'
            - 'null'
          format: 'date'
    Unavailability:
      type: 'object'
      required:
        - 'start'
        - 'end'
      properties:
        start:
          type: 'string'
          format: 'date-time'
        end:
          type: 'string'
          format: 'date-time'
        reason:
          type: 'string'
          enum:
            - 'time_off'
            - 'unavailable'
    Preferences:
      type: 'object'
      properties:
        preferredDaysOff:
          type: 'array'
          items:
            type: 'integer'
            minimum: 1
            maximum: 7
        avoidNights:
          type: 'boolean'
    EmployeeCreate:
      type: 'object'
      required:
        - 'name'
        - 'hourlyRateMinor'
        - 'contract'
      properties:
        name:
          type: 'string'
        email:
          type:
            - 'string'
            - 'null'
          format: 'email'
        hourlyRateMinor:
          type: 'integer'
          minimum: 0
          description: 'Integer minor currency units'
        contract:
          '$ref': '#/components/schemas/Contract'
        skills:
          type: 'array'
          items:
            '$ref': '#/components/schemas/SkillGrant'
        unavailability:
          type: 'array'
          items:
            '$ref': '#/components/schemas/Unavailability'
        preferences:
          '$ref': '#/components/schemas/Preferences'
    EmployeeUpdate:
      type: 'object'
      properties:
        name:
          type: 'string'
        email:
          type:
            - 'string'
            - 'null'
          format: 'email'
        hourlyRateMinor:
          type: 'integer'
          minimum: 0
          description: 'Integer minor currency units'
        contract:
          '$ref': '#/components/schemas/Contract'
        skills:
          type: 'array'
          items:
            '$ref': '#/components/schemas/SkillGrant'
        unavailability:
          type: 'array'
          items:
            '$ref': '#/components/schemas/Unavailability'
        preferences:
          '$ref': '#/components/schemas/Preferences'
    Employee:
      type: 'object'
      properties:
        id:
          type: 'string'
          format: 'uuid'
        name:
          type: 'string'
        email:
          type:
            - 'string'
            - 'null'
          format: 'email'
        hourlyRateMinor:
          type: 'integer'
          minimum: 0
          description: 'Integer minor currency units'
        contract:
          '$ref': '#/components/schemas/Contract'
        skills:
          type: 'array'
          items:
            '$ref': '#/components/schemas/SkillGrant'
        unavailability:
          type: 'array'
          items:
            '$ref': '#/components/schemas/Unavailability'
        preferences:
          '$ref': '#/components/schemas/Preferences'
        version:
          type: 'integer'
    Roster:
      type: 'object'
      properties:
        id:
          type: 'string'
          format: 'uuid'
        name:
          type: 'string'
        weekStart:
          type: 'string'
          format: 'date'
        timezone:
          type: 'string'
        status:
          type: 'string'
          enum:
            - 'draft'
            - 'published'
            - 'archived'
        version:
          type: 'integer'
        shiftCount:
          type: 'integer'
        createdAt:
          type: 'string'
          format: 'date-time'
    RosterCreate:
      type: 'object'
      required:
        - 'name'
        - 'weekStart'
        - 'timezone'
      properties:
        name:
          type: 'string'
        weekStart:
          type: 'string'
          format: 'date'
        timezone:
          type: 'string'
    Shift:
      type: 'object'
      properties:
        id:
          type: 'string'
          format: 'uuid'
        label:
          type: 'string'
        start:
          type: 'string'
          format: 'date-time'
        end:
          type: 'string'
          format: 'date-time'
        skill:
          type: 'string'
        headcount:
          type: 'integer'
    ShiftCreate:
      type: 'object'
      required:
        - 'label'
        - 'start'
        - 'end'
        - 'skill'
        - 'headcount'
      properties:
        label:
          type: 'string'
        start:
          type: 'string'
          format: 'date-time'
        end:
          type: 'string'
          format: 'date-time'
          description: 'After start, at most 16 h later'
        skill:
          type: 'string'
        headcount:
          type: 'integer'
          minimum: 1
          maximum: 50
    Assignment:
      type: 'object'
      required:
        - 'shiftId'
        - 'employeeId'
      properties:
        shiftId:
          type: 'string'
          format: 'uuid'
        employeeId:
          type: 'string'
          format: 'uuid'
        pinned:
          type: 'boolean'
        source:
          type: 'string'
          enum:
            - 'solver'
            - 'manual'
    SolveRequest:
      type: 'object'
      properties:
        seed:
          type: 'integer'
          minimum: 0
          maximum: 4294967295
          default: 1
        iterations:
          type: 'integer'
          minimum: 0
          maximum: 500000
          default: 20000
          description: 'Capped by SOLVER_MAX_ITERATIONS'
        keepPinned:
          type: 'boolean'
          default: true
    EvaluateRequest:
      type: 'object'
      required:
        - 'assignments'
      properties:
        assignments:
          type: 'array'
          maxItems: 5000
          items:
            type: 'object'
            required:
              - 'shiftId'
              - 'employeeId'
            properties:
              shiftId:
                type: 'string'
                format: 'uuid'
              employeeId:
                type: 'string'
                format: 'uuid'
    AssignmentsReplace:
      type: 'object'
      required:
        - 'assignments'
      properties:
        assignments:
          type: 'array'
          maxItems: 5000
          items:
            type: 'object'
            required:
              - 'shiftId'
              - 'employeeId'
              - 'pinned'
            properties:
              shiftId:
                type: 'string'
                format: 'uuid'
              employeeId:
                type: 'string'
                format: 'uuid'
              pinned:
                type: 'boolean'
    Violation:
      type: 'object'
      properties:
        constraint:
          type: 'string'
          enum:
            - 'UNFILLED_SLOT'
            - 'SKILL_MISSING'
            - 'SKILL_EXPIRED'
            - 'UNAVAILABLE'
            - 'OVERLAP'
            - 'MIN_REST'
            - 'MAX_HOURS'
            - 'MAX_CONSECUTIVE_DAYS'
            - 'MAX_SHIFTS_PER_DAY'
            - 'MIN_HOURS'
            - 'DAY_OFF_PREFERENCE'
            - 'AVOID_NIGHTS'
            - 'OVERTIME'
            - 'FAIRNESS'
        severity:
          type: 'string'
          enum:
            - 'hard'
            - 'soft'
        penalty:
          type: 'integer'
        employeeId:
          type:
            - 'string'
            - 'null'
        shiftIds:
          type: 'array'
          items:
            type: 'string'
        message:
          type: 'string'
    Evaluation:
      type: 'object'
      properties:
        score:
          type: 'object'
          properties:
            hard:
              type: 'integer'
            soft:
              type: 'integer'
        feasible:
          type: 'boolean'
        violations:
          type: 'array'
          items:
            '$ref': '#/components/schemas/Violation'
        employees:
          type: 'array'
          items:
            type: 'object'
            properties:
              employeeId:
                type: 'string'
              shifts:
                type: 'integer'
              hours:
                type: 'number'
              overtimeHours:
                type: 'number'
              costMinor:
                type: 'integer'
        metrics:
          type: 'object'
          properties:
            slotsTotal:
              type: 'integer'
            slotsFilled:
              type: 'integer'
            coverageRatio:
              type: 'number'
            totalHours:
              type: 'number'
            laborCostMinor:
              type: 'integer'
            utilizationStdDev:
              type: 'number'
    Schedule:
      type: 'object'
      properties:
        roster:
          '$ref': '#/components/schemas/Roster'
        shifts:
          type: 'array'
          items:
            '$ref': '#/components/schemas/Shift'
        employees:
          type: 'array'
          items:
            type: 'object'
            properties:
              id:
                type: 'string'
              name:
                type: 'string'
              skills:
                type: 'array'
                items:
                  '$ref': '#/components/schemas/SkillGrant'
              contract:
                '$ref': '#/components/schemas/Contract'
        assignments:
          type: 'array'
          items:
            '$ref': '#/components/schemas/Assignment'
        evaluation:
          '$ref': '#/components/schemas/Evaluation'
    SolverRun:
      type: 'object'
      properties:
        id:
          type: 'string'
          format: 'uuid'
        seed:
          type: 'integer'
        iterations:
          type: 'integer'
        hardScore:
          type: 'integer'
        softScore:
          type: 'integer'
        greedyHard:
          type: 'integer'
        greedySoft:
          type: 'integer'
        coverageRatio:
          type: 'number'
        elapsedMs:
          type: 'integer'
        createdAt:
          type: 'string'
          format: 'date-time'
    ConstraintCatalog:
      type: 'object'
      properties:
        constraints:
          type: 'array'
          items:
            type: 'object'
            properties:
              id:
                type: 'string'
              severity:
                type: 'string'
              title:
                type: 'string'
              unit:
                type: 'string'
        defaultWeights:
          type: 'object'
          additionalProperties:
            type: 'number'
