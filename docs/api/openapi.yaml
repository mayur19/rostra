        400:
          '$ref': '#/components/responses/Error'
        422:
          '$ref': '#/components/responses/Error'
  '/api/v1/auth/login':
    post:
      operationId: 'login'
      summary: 'Sign in; sets HttpOnly session cookie and rotates CSRF token'
      tags:
        - 'Auth'
      x-status: 'implemented'
      description: 'Throttled per IP, per IP+email, per distinct emails per source, and per email with progressive backoff (ADR-0006).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/LoginRequest'
      security: []
      responses:
        200:
          description: 'OK'
          content:
            application/json:
              schema:
                allOf:
                  - '$ref': '#/components/schemas/Envelope'
                  - type: 'object'
                    properties:
                      data:
                        '$ref': '#/components/schemas/CsrfToken'
        400:
          '$ref': '#/components/responses/Error'
        422:
          '$ref': '#/components/responses/Error'
        429:
          '$ref': '#/components/responses/Error'
  '/api/v1/auth/logout':
    post:
      operationId: 'logout'
